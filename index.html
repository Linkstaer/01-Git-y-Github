<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ideas Último Año</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
<h2>Ideas Último Año</h2>
<nav>
<a href="#">Inicio</a>
<a href="#">Propuestas</a>
<a href="#">Contacto</a>
</nav>
</header>
<main>
<section class="hero">
<h1>Propuestas para el último año</h1>
<p>Votá ideas para hacer este último año inolvidable.</p>
<button id="votar">Apoyar esta idea</button>
<p id="contador">Votos: 0</p>
</section>
<section class="propuesta">
<h2>Enviar una propuesta</h2>
<form id="formPropuesta">
<label for="nombre">Tu nombre</label>
<input type="text" id="nombre" placeholder="Escribí tu nombre" required>
<label for="idea">Tu propuesta</label>
<input type="text" id="idea" placeholder="Escribí tu idea" required>
<button type="submit">Enviar propuesta</button>
<p id="mensaje"></p>
</form>
<section class="ideas">
<h2>Ideas populares</h2>
<ul class="lista-ideas">
<li class="idea">
<p>Viaje de egresados</p>
<img src="img/Via-Egresados.jpg" alt="Viaje de egresados">
</li>
<li class="idea">
<p>Fiesta temática</p>
<img src="img/Fst-Tematica.jpg" alt="Fiesta temática">
</li>
<li class="idea">
<p>Torneo deportivo entre cursos</p>
<img src="img/Trn-Deportivo.jpeg" alt="Torneo deportivo">
</li>
</ul>
</section>
</main>
<footer>

<p>Promoción 2026</p>

</footer>

<script src="script.js"></script>

</body>
</html>
